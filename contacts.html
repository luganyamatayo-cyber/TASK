<body>
    <header>
        <h1>Mat Graphics</h1>
        <p>Creative Design Solutions</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="ourteam.html">Our Team</a>
            <a href="contacts.html">Contacts</a>
        </nav>

    <main>
        <section class="contact-info">
            <h2>Get in Touch</h2>
            <p>Email: lugaayamathew@gmail.com</p>
            <p>Phone: +256 765487021</p>
            <p>Location: Bugema, Uganda</p>
        </section>
          <div class="contact-form">

            <h2>Send  a Message</h2>

            <form action="#" method="post">


                <label for="name">
                    Your Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required>


                <label for="email">
                    Email Address
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>


                <label for="subject">
                    Subject
                </label>

                <input type="text"
                       id="subject"
                       name="subject"
                       placeholder="Enter subject"
                       required>


                <label for="message">
                    Message
                </label>

                <textarea id="message"
                          name="message"
                          rows="6"
                          placeholder="Write your message here..."
                          required></textarea>


                <button type="submit"
                        class="btn">
                    Send Message
                </button>


            </form>

        </div>

    </main>

</body>
